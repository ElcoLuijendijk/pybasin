# Conda environment for PyBasin
#
# Create the environment with:
#     conda env create -f environment.yml
# Then activate it with:
#     conda activate pybasin
#
# The dependencies below were derived from the imports in the source code.
# numpy, scipy, pandas and matplotlib provide the core functionality.
# numba is imported by the vitrinite reflectance and thermochronology modules
# (lib/easyRo.py, lib/AFTannealingLib.py and lib/helium_diffusion_models.py)
# and is therefore required.
# xarray is used by lib/pybasin_io.py to package the burial and thermal
# history grid saved in each model run's .pck output file.
# tqdm draws the progress bars shown during the heat flow/solute/pore
# pressure timestep loop and the vitrinite reflectance, AFT and (U-Th)/He
# node loops in lib/pybasin_lib.py.
#
# Versions below are pinned to the combination verified against the test
# suite (tests/test_vectorized.py and tests/test_example_datasets.py). If
# conda-forge cannot resolve an exact pin on your platform, relax it to a
# minimum version bound (e.g. numpy>=2.2) instead of removing the pin.

name: pybasin

channels:
  - conda-forge

dependencies:
  # core runtime requirements
  - python=3.13
  - numpy=2.2.4
  - scipy=1.15.2
  - pandas=2.2.3
  - matplotlib=3.10.1
  - numba=0.61.2
  - xarray=2026.4.0
  - tqdm=4.67.1

  # optional, provides a fortran compiler to build the faster fission track
  # annealing module with f2py (run f2py in the lib subdirectory)
  - fortran-compiler

  # optional, needed to run the test suite
  - pytest=9.0.2

  # optional, needed to run the jupyter notebooks such as the heat flow
  # benchmark in the tests directory
  - jupyter

  # pythermo is only required for zircon (U-Th)/He ages with the ZRDAAM model.
  # it is not available on conda and is left out of the default environment so
  # that the environment always builds. if you need zircon ages, install it with:
  #     pip install git+https://github.com/OpenThermochronology/PyThermo
  - pip
